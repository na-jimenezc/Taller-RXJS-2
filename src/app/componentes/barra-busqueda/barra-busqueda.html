<div class="barra-busqueda card mb-4">
  <div class="card-header bg-primary text-white">
    <h5 class="mb-0">
      <i class="bi bi-search me-2"></i>¿A quién buscas?
    </h5>
  </div>
  <div class="card-body">
    <form [formGroup]="searchForm" (ngSubmit)="buscarUsuario()">
      <div class="row g-3 align-items-center">
        <div class="col-md-8">
          <label for="username" class="form-label fw-semibold">Nombre de Usuario:</label>
          <input 
            type="text" 
            id="username"
            class="form-control" 
            formControlName="username"
            placeholder="Ingresa el username (ej: emilys)"
            (keypress)="presionarBusqueda($event)"
            [class.is-invalid]="campoInvalido">
          
          <div *ngIf="campoInvalido" class="invalid-feedback d-block">
            <i class="bi bi-exclamation-triangle me-1"></i>{{ mensajeError }}
          </div>
        </div>
        
        <div class="col-md-4 d-flex align-items-end gap-2">
          <button 
            type="submit" 
            class="btn btn-primary flex-fill"
            [disabled]="searchForm.invalid || loading">
            <span *ngIf="!loading">
              <i class="bi bi-search me-1"></i> Buscar
            </span>
            <span *ngIf="loading">
              <i class="bi bi-arrow-repeat me-1 spinner"></i> Buscando...
            </span>
          </button>
          
          <button 
            type="button" 
            class="btn btn-outline-secondary"
            (click)="limpiarBusqueda()">
            <i class="bi bi-x-circle me-1"></i> Limpiar
          </button>
        </div>
      </div>
    </form>
  </div>
</div>
